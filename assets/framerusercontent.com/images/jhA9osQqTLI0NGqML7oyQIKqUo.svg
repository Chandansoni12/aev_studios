<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1017"/>
      <stop offset="100%" stop-color="#07080C"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="aevGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E0E7FF"/>
      <stop offset="100%" stop-color="#A5B4FC"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="32" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base with Rounded Squircle -->
  <rect width="1024" height="1024" rx="260" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="1000" height="1000" rx="250" stroke="url(#borderGrad)" stroke-width="16" fill="none"/>

  <!-- Subtle Radial Glow behind logo mark -->
  <circle cx="512" cy="512" r="320" fill="#6366F1" opacity="0.18" filter="url(#glow)"/>

  <!-- Stylized Geometric "AEV" Monogram -->
  <g transform="translate(180, 220)">
    <!-- Letter A (Left Chevron/Peak) -->
    <path d="M 120 440 L 260 140 L 320 140 L 460 440 L 375 440 L 335 345 L 245 345 L 205 440 Z M 262 285 L 318 285 L 290 205 Z" fill="url(#aevGrad)"/>
    
    <!-- Dynamic Forward Slant Accent Line representing Growth / Velocity -->
    <path d="M 285 240 L 490 240 L 510 285 L 305 285 Z" fill="url(#accentGrad)" opacity="0.9"/>

    <!-- Letter E (Middle Intersecting Blades) -->
    <path d="M 390 140 L 540 140 L 525 200 L 430 200 L 420 260 L 505 260 L 490 318 L 410 318 L 400 380 L 530 380 L 515 440 L 360 440 Z" fill="url(#aevGrad)" opacity="0.95"/>

    <!-- Letter V (Right Arrow / Blade) -->
    <path d="M 470 140 L 540 140 L 585 345 L 630 140 L 700 140 L 620 440 L 550 440 Z" fill="url(#aevGrad)"/>
    
    <!-- Modern Tech Dot Accent -->
    <circle cx="680" cy="420" r="16" fill="#818CF8"/>
  </g>
</svg>