<svg xmlns="http://www.w3.org/2000/svg" width="168" height="36" viewBox="0 0 168 36" fill="none">
  <defs>
    <linearGradient id="aevBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1017"/>
      <stop offset="100%" stop-color="#07080C"/>
    </linearGradient>
    <linearGradient id="aevBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="aevGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E0E7FF"/>
      <stop offset="100%" stop-color="#A5B4FC"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
  </defs>

  <!-- Logo Mark (Left 36x36 Squircle) -->
  <g transform="translate(0, 0)">
    <rect width="36" height="36" rx="9" fill="url(#aevBg)"/>
    <rect x="0.75" y="0.75" width="34.5" height="34.5" rx="8.25" stroke="url(#aevBorder)" stroke-width="1.5" fill="none"/>
    
    <!-- Mini AEV Monogram -->
    <g transform="translate(6, 7) scale(0.024)">
      <!-- Peak A -->
      <path d="M 120 440 L 260 140 L 320 140 L 460 440 L 375 440 L 335 345 L 245 345 L 205 440 Z M 262 285 L 318 285 L 290 205 Z" fill="url(#aevGrad)"/>
      <path d="M 285 240 L 490 240 L 510 285 L 305 285 Z" fill="url(#accentGrad)" opacity="0.9"/>
      <!-- Mid E -->
      <path d="M 390 140 L 540 140 L 525 200 L 430 200 L 420 260 L 505 260 L 490 318 L 410 318 L 400 380 L 530 380 L 515 440 L 360 440 Z" fill="url(#aevGrad)" opacity="0.95"/>
      <!-- Right V -->
      <path d="M 470 140 L 540 140 L 585 345 L 630 140 L 700 140 L 620 440 L 550 440 Z" fill="url(#aevGrad)"/>
      <circle cx="680" cy="420" r="16" fill="#818CF8"/>
    </g>
  </g>

  <!-- Clean Vector Typography: AEV Studios -->
  <text x="46" y="24" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" font-size="17" font-weight="700" letter-spacing="-0.03em">AEV Studios</text>
</svg>
